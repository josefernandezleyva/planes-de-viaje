<!doctype html>
<html lang="es">
<head>

<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>

<meta name="mobile-web-app-capable" content="yes">

<meta name="claude:viewport-fit-sides" content="cover">
<title>Planes de viaje</title>
<style>
/* Layout: iOS-style single column. Glass nav with sync status, floating glass tab bar (Agenda, Semana, Decidir,
   Actividad, Viaje), inset grouped lists with swipe actions, bottom sheets for editing. */
:root{
  --bg:#F2F2F7; --bg2:#FFFFFF; --chip:#F2F2F7;
  --label:#000000; --label2:rgba(60,60,67,.64); --label3:rgba(60,60,67,.32);
  --sep:rgba(60,60,67,.22); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.22);
  --seg-on:#FFFFFF;
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500; --yellow:#FFCC00;
  --indigo:#5856D6; --teal:#30B0C7; --purple:#AF52DE; --pink:#FF2D55; --brown:#A2845E;
  --cyan:#32ADE6; --mint:#00C7BE; --gray:#8E8E93;
  --green-ink:#248A3D; --red-ink:#D70015; --orange-ink:#C93400; --blue-ink:#0040DD; --purple-ink:#8944AB;
  --green-t:rgba(52,199,89,.15); --red-t:rgba(255,59,48,.12); --orange-t:rgba(255,149,0,.15);
  --blue-t:rgba(0,122,255,.12); --purple-t:rgba(175,82,222,.13);
  --glass:rgba(255,255,255,.58); --glass-solid:rgba(246,246,250,.9);
  --glass-line:rgba(255,255,255,.8); --glass-hi:rgba(255,255,255,.95);
  --shadow:0 10px 30px rgba(0,0,0,.10),0 1px 3px rgba(0,0,0,.06);
  --scrim:rgba(0,0,0,.22);
  --amb1:rgba(48,176,199,.30); --amb2:rgba(255,149,0,.16); --amb3:rgba(88,86,214,.14);
  --hero-ciudad:linear-gradient(140deg,#0A6CFF 0%,#1FA2D6 50%,#2FC6A8 100%);
  --hero-playa:linear-gradient(140deg,#0090C2 0%,#22BFD6 50%,#6FD9BC 100%);
  --hero-traslado:linear-gradient(140deg,#4B49C8 0%,#9150D6 52%,#EE7F68 100%);
  --hero-prep:linear-gradient(140deg,#E8590C 0%,#F08C2E 50%,#F5B94A 100%);
  --prev:#B7791F; --prev-t:#FDF4E7; --prev-ink:#7A4A00; --kc:#F2F2F7; --kc-pre:#FFFFFF; --col-line:rgba(0,122,255,.18);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --font-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --bg2:#1C1C1E; --chip:#2C2C2E;
    --label:#FFFFFF; --label2:rgba(235,235,245,.64); --label3:rgba(235,235,245,.32);
    --sep:rgba(84,84,88,.7); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
    --seg-on:#636366;
    --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --yellow:#FFD60A;
    --indigo:#5E5CE6; --teal:#40C8E0; --purple:#BF5AF2; --pink:#FF375F; --brown:#AC8E68;
    --cyan:#64D2FF; --mint:#63E6E2; --gray:#8E8E93;
    --green-ink:#30DB5B; --red-ink:#FF6961; --orange-ink:#FFB340; --blue-ink:#409CFF; --purple-ink:#DA8FFF;
    --green-t:rgba(48,209,88,.2); --red-t:rgba(255,69,58,.2); --orange-t:rgba(255,159,10,.2);
    --blue-t:rgba(10,132,255,.22); --purple-t:rgba(191,90,242,.22);
    --glass:rgba(40,40,44,.55); --glass-solid:rgba(30,30,32,.92);
    --glass-line:rgba(255,255,255,.12); --glass-hi:rgba(255,255,255,.14);
    --shadow:0 10px 30px rgba(0,0,0,.55);
    --scrim:rgba(0,0,0,.5);
    --amb1:rgba(64,200,224,.20); --amb2:rgba(255,159,10,.10); --amb3:rgba(94,92,230,.16);
    --hero-ciudad:linear-gradient(140deg,#0050C8 0%,#137FB0 50%,#1C9C85 100%);
    --hero-playa:linear-gradient(140deg,#006E96 0%,#1296AA 50%,#3FAF93 100%);
    --hero-traslado:linear-gradient(140deg,#3634A0 0%,#7238B0 52%,#C2604E 100%);
    --hero-prep:linear-gradient(140deg,#B4440A 0%,#C46C1E 50%,#C9902F 100%);
    --prev:#C9902F; --prev-t:#221B11; --prev-ink:#F2C46D; --kc:#2C2C2E; --kc-pre:#2C2C2E; --col-line:rgba(10,132,255,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --bg2:#1C1C1E; --chip:#2C2C2E;
  --label:#FFFFFF; --label2:rgba(235,235,245,.64); --label3:rgba(235,235,245,.32);
  --sep:rgba(84,84,88,.7); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --seg-on:#636366;
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --yellow:#FFD60A;
  --indigo:#5E5CE6; --teal:#40C8E0; --purple:#BF5AF2; --pink:#FF375F; --brown:#AC8E68;
  --cyan:#64D2FF; --mint:#63E6E2; --gray:#8E8E93;
  --green-ink:#30DB5B; --red-ink:#FF6961; --orange-ink:#FFB340; --blue-ink:#409CFF; --purple-ink:#DA8FFF;
  --green-t:rgba(48,209,88,.2); --red-t:rgba(255,69,58,.2); --orange-t:rgba(255,159,10,.2);
  --blue-t:rgba(10,132,255,.22); --purple-t:rgba(191,90,242,.22);
  --glass:rgba(40,40,44,.55); --glass-solid:rgba(30,30,32,.92);
  --glass-line:rgba(255,255,255,.12); --glass-hi:rgba(255,255,255,.14);
  --shadow:0 10px 30px rgba(0,0,0,.55);
  --scrim:rgba(0,0,0,.5);
  --amb1:rgba(64,200,224,.20); --amb2:rgba(255,159,10,.10); --amb3:rgba(94,92,230,.16);
  --hero-ciudad:linear-gradient(140deg,#0050C8 0%,#137FB0 50%,#1C9C85 100%);
  --hero-playa:linear-gradient(140deg,#006E96 0%,#1296AA 50%,#3FAF93 100%);
  --hero-traslado:linear-gradient(140deg,#3634A0 0%,#7238B0 52%,#C2604E 100%);
  --hero-prep:linear-gradient(140deg,#B4440A 0%,#C46C1E 50%,#C9902F 100%);
  --prev:#C9902F; --prev-t:#221B11; --prev-ink:#F2C46D; --kc:#2C2C2E; --kc-pre:#2C2C2E; --col-line:rgba(10,132,255,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.3;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg)}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg{display:block}
a{color:var(--blue)}

.ambient{position:fixed;inset:0 0 auto;height:360px;z-index:0;pointer-events:none;
  background:radial-gradient(60% 80% at 12% 0%,var(--amb1),transparent 70%),radial-gradient(45% 70% at 92% 6%,var(--amb2),transparent 70%),radial-gradient(40% 60% at 55% 28%,var(--amb3),transparent 70%)}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--glass-line);box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi)}

/* Nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;transition:background .2s}
.nav-in{position:relative;max-width:720px;margin:0 auto;height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.scrolled .nav{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:0 .5px 0 var(--sep)}
.nav-title{position:absolute;left:50%;transform:translateX(-50%);font-size:17px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
body.scrolled .nav-title{opacity:1}
.netpill{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px 0 11px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;color:var(--label);max-width:46vw;min-width:0}
.netpill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pushok{display:flex;gap:10px;align-items:flex-start;margin:0 0 10px;font-size:15px;line-height:1.35}
.pushok svg{width:22px;height:22px;flex:none;color:#fff;background:var(--green);border-radius:50%;padding:3px;margin-top:1px}
.pushok small{color:var(--label2)}
.bigbtn svg{display:inline-block;width:18px;height:18px;vertical-align:-3px;margin-right:6px}
.steps svg{width:17px;height:17px;vertical-align:-3px;color:var(--blue)}
.netpill i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--gray)}
.netpill i.ok{background:var(--green)} .netpill i.enviando,.netpill i.cargando{background:var(--blue);animation:pulse 1s infinite} .netpill i.offline,.netpill i.error{background:var(--orange)} .netpill i.demo{background:var(--purple)}
.nav-btns{display:flex;gap:2px;padding:3px;border-radius:999px}
.nav-btns button{width:40px;height:40px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--label)}
.nav-btns svg{width:21px;height:21px}
.av{display:inline-grid;place-items:center;width:var(--s,24px);height:var(--s,24px);border-radius:50%;background:var(--pc,var(--gray));color:#fff;font:700 calc(var(--s,24px)*.46)/1 var(--font-round);flex:none;text-transform:uppercase}

/* Page */
.view{position:relative;z-index:1;max-width:720px;margin:0 auto;padding-block:0 calc(130px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lt{padding:0 4px 14px}
.eyebrow{margin:0;font-size:13px;font-weight:600;color:var(--label2)}
.lt h1{margin:2px 0 0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:24px 4px 8px}
.sh h3{margin:0;font-size:20px;font-weight:700;min-width:0;text-wrap:balance}
.sh .sub{font-size:15px;color:var(--label2);font-weight:500}
.link{all:unset;color:var(--blue);font-size:15px;cursor:pointer;white-space:nowrap}
.link:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.hint{margin:8px 6px 0;font-size:13px;color:var(--label2);line-height:1.4}
.loading{padding:60px 20px;text-align:center;color:var(--label2)}

.banner{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;background:var(--bg2);border-radius:22px;padding:14px 16px;margin-bottom:14px}
.banner .bi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--purple-t);color:var(--purple-ink)}
.banner .bi svg{width:20px;height:20px}
.banner p{margin:0;font-size:14px;color:var(--label2);line-height:1.4}
.banner b{display:block;color:var(--label);font-size:15px;margin-bottom:2px}
.banner .acts2{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* Trip summary */
.trip{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;background:var(--bg2);border-radius:22px;padding:14px 16px;margin-bottom:14px}
.big{font:700 40px/1 var(--font-round);color:var(--blue);font-variant-numeric:tabular-nums;text-align:center}
.bigl{font-size:12px;color:var(--label2);font-weight:600;margin-top:4px;max-width:9ch;text-align:center;line-height:1.2;margin-inline:auto}
.trip-stats{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.trip-info{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--label2);margin-top:8px;line-height:1.35}
.trip-info span{display:inline-flex;align-items:flex-start;gap:5px}
.trip-info svg{width:15px;height:15px;flex:none;margin-top:1px}

/* Date strip */
.strip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 0 6px;margin:0 0 12px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.dpill{flex:0 0 52px;height:72px;border:0;border-radius:18px;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;scroll-snap-align:center}
.dpill.wide{flex-basis:64px}
.dpill small{font-size:11px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.04em}
.dpill b{font:600 21px/1 var(--font-round);font-variant-numeric:tabular-nums}
.dpill svg{width:22px;height:22px}
.dpill i{width:6px;height:6px;border-radius:50%}
.dpill i.p{background:var(--orange)} .dpill i.c{background:var(--green)}
.dpill.today b{color:var(--red)}
.dpill.on{background:var(--blue);color:#fff}
.dpill.on small{color:rgba(255,255,255,.82)} .dpill.on b{color:#fff} .dpill.on i.p,.dpill.on i.c{background:#fff}

/* Hero */
.hero{position:relative;overflow:hidden;isolation:isolate;border-radius:28px;padding:14px 16px 16px;color:#fff;display:grid;gap:12px}
.hero.ciudad{background:var(--hero-ciudad)} .hero.playa{background:var(--hero-playa)} .hero.traslado{background:var(--hero-traslado)} .hero.prep{background:var(--hero-prep)}
.hero::before{content:"";position:absolute;width:240px;height:240px;right:-70px;top:-110px;border-radius:50%;z-index:-1;background:radial-gradient(circle,rgba(255,255,255,.5),rgba(255,255,255,0) 68%)}
.hero::after{content:"";position:absolute;width:300px;height:200px;left:-60px;bottom:-120px;border-radius:50%;z-index:-1;background:radial-gradient(circle,rgba(255,255,255,.28),rgba(255,255,255,0) 70%)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gchip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;min-width:0;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.38);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);font-size:13px;font-weight:600;color:#fff}
.gchip svg{width:14px;height:14px;flex:none}
.gchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gbtn{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.38);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.gbtn svg{width:18px;height:18px}
.hero-mid{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hero-mid>div:first-child{min-width:0}
.hero-date{margin:0;font-size:15px;font-weight:500;opacity:.9}
.hero h2{margin:2px 0 0;font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.hring{position:relative;width:56px;height:56px;flex:none}
.hring span{position:absolute;inset:0;display:grid;place-items:center;font:700 13px var(--font-round);font-variant-numeric:tabular-nums}
.hero-foot{display:flex;flex-wrap:wrap;gap:6px}

/* Lists and rows */
.list{background:var(--bg2);border-radius:22px;overflow:hidden}
.list-empty{margin:0;padding:16px;color:var(--label2);font-size:15px}
.sw{position:relative;overflow:hidden}
.sw+.sw .row::before,.sw+.addrow::before,.list-empty+.addrow::before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;transform:scaleY(.5);transform-origin:top;background:var(--sep);z-index:3}
.row{position:relative;z-index:1;display:grid;grid-template-columns:34px minmax(0,1fr) 30px;gap:12px;align-items:start;padding:12px 10px 12px 16px;background:var(--bg2);touch-action:pan-y;transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sw.dragging .row{transition:none}
.r-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--c);color:#fff}
.r-ico svg{width:20px;height:20px}
.s-pending .r-ico{background:transparent;color:var(--c);border:1.5px dashed var(--c)}
.s-discarded .r-ico,.s-archived .r-ico{background:var(--fill);color:var(--label3)}
.r-main{min-width:0;display:grid;gap:3px}
.r-meta{margin:0;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums}
.r-meta svg{width:13px;height:13px}
.r-meta .mi{display:inline-flex;align-items:center;gap:3px}
.r-open{all:unset;display:block;font-size:17px;line-height:1.25;color:var(--label);cursor:pointer;overflow-wrap:anywhere}
.r-open::after{content:"";position:absolute;inset:0;z-index:0}
.r-open:focus-visible::after{outline:2px solid var(--blue);outline-offset:-3px}
.s-discarded .r-open{color:var(--label2);text-decoration:line-through;text-decoration-color:var(--label3)}
.s-archived .r-open,.done .r-open{color:var(--label2)}
.done .r-open{text-decoration:line-through;text-decoration-color:var(--label3)}
.r-note{margin:0;font-size:14px;color:var(--label2);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.r-warn{margin:2px 0 0;display:flex;gap:5px;align-items:flex-start;font-size:13px;color:var(--orange-ink);line-height:1.3}
.r-warn svg{width:15px;height:15px;flex:none;margin-top:1px}
.r-pills{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;align-items:center}
.r-side{position:relative;z-index:2;align-self:center;display:grid;place-items:center;color:var(--label3)}
.r-side svg{width:14px;height:14px}
.chk{all:unset;position:relative;z-index:2;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;cursor:pointer;color:var(--label3)}
.chk svg{width:26px;height:26px}
.chk.on{color:var(--green)}
.chk:focus-visible{outline:2px solid var(--blue)}
.bp{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--orange-t);color:var(--orange-ink)}
.bn{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--blue-t);color:var(--blue-ink)}
.votes{display:inline-flex;align-items:center;gap:6px}
.vchip{position:relative;display:inline-flex}
.vchip .av{--s:22px}
.vchip i{position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);font-style:normal;font-size:9px;font-weight:800;line-height:1}
.vchip i.si{color:var(--green-ink)} .vchip i.no{color:var(--red-ink)} .vchip i.na{color:var(--label3)}
.vchip.wait .av{opacity:.45}
.pill{height:32px;padding:0 13px;border-radius:999px;border:0;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:5px;cursor:pointer;background:var(--fill);color:var(--label)}
.pill svg{width:16px;height:16px}
.pill.ok{background:var(--green-t);color:var(--green-ink)} .pill.no{background:var(--red-t);color:var(--red-ink)}
.pill.blue{background:var(--blue-t);color:var(--blue-ink)} .pill.purple{background:var(--purple-t);color:var(--purple-ink)}
.pill.ok.sel{background:var(--green);color:#fff} .pill.no.sel{background:var(--red);color:#fff}

.sw-act{position:absolute;inset:0;display:flex;align-items:center;gap:8px;padding:0 22px;color:#fff;font-size:15px;font-weight:600;visibility:hidden}
.sw-act svg{width:22px;height:22px;transition:transform .15s}
.sw-r{justify-content:flex-start} .sw-l{justify-content:flex-end}

.c-vsi,.c-hecho{background:var(--green)} .c-vno,.c-discard{background:var(--red)} .c-restore{background:var(--blue)} .c-archive{background:var(--purple)}

.addrow{all:unset;position:relative;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:52px;color:var(--blue);font-size:17px;cursor:pointer}

.disc-t span{color:var(--label2);font-weight:600}
.disc-t:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

/* Evaluate */
.eval{background:var(--bg2);border-radius:22px;padding:14px 16px;display:grid;gap:12px}
.eval-o{display:grid;gap:8px;border-top:1px solid var(--sep);padding-top:12px}
.eval-o div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:14px;color:var(--label2)}
.eval-o b{color:var(--label);font-weight:600}
.stars{display:flex;gap:2px}
.star{all:unset;cursor:pointer;color:var(--fill2);padding:2px;line-height:0;border-radius:6px}
.star svg{width:30px;height:30px}
.star.on{color:var(--yellow)}
.star:focus-visible{outline:2px solid var(--blue)}
.mini-stars{color:var(--yellow);letter-spacing:1px}
.field{width:100%;border:0;border-radius:14px;background:var(--chip);color:var(--label);font:17px/1.35 var(--font);padding:10px 12px;resize:vertical}
.field.mono{font:13px/1.45 ui-monospace,Menlo,monospace;resize:none}

/* Week */
.seg{display:flex;padding:2px;border-radius:999px;background:var(--fill);margin-bottom:12px}
.seg button{flex:1;min-width:0;height:34px;border:0;border-radius:999px;background:transparent;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.seg button.on{background:var(--seg-on);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.wk-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;background:var(--bg2);border-radius:20px;padding:10px 4px;margin-bottom:12px}
.wk-cell{all:unset;display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 0;border-radius:12px;cursor:pointer}
.wk-cell:focus-visible{outline:2px solid var(--blue)}
.wk-cell small{font-size:11px;font-weight:600;color:var(--label2)}
.wk-cell b{font:600 17px/1 var(--font-round);width:34px;height:34px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.wk-cell.trip b{background:var(--blue-t);color:var(--blue-ink)}
.wk-cell.off{opacity:.35;cursor:default}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%}
.wk-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--bg2);border-radius:16px;padding:8px 12px 8px 16px;margin-bottom:12px;font-size:17px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(158px,1fr);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:thin}
.col{scroll-snap-align:start;background:var(--bg2);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:box-shadow .3s}
.col.flash{box-shadow:0 0 0 2px var(--blue)}
.col-h{all:unset;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;cursor:pointer;padding:2px 2px 8px;border-bottom:1px solid var(--sep)}
.col-h:focus-visible{outline:2px solid var(--blue);border-radius:8px}
.col-h small{display:block;font-size:12px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.03em}
.col-h b{display:block;font-size:16px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.col-h .pl{display:block;font-size:12px;color:var(--label2);margin-top:2px}
.chip{all:unset;box-sizing:border-box;display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;padding:8px;border-radius:12px;background:var(--chip);cursor:pointer;border:1.5px solid transparent}
.chip:focus-visible{outline:2px solid var(--blue)}
.chip>div{min-width:0}
.ci{width:20px;height:20px;border-radius:6px;background:var(--c);color:#fff;display:grid;place-items:center}
.ci svg{width:13px;height:13px}
.chip small{display:block;font-size:11.5px;color:var(--label2);font-variant-numeric:tabular-nums}
.chip .ct{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.chip .cp{color:var(--orange-ink);font-weight:600;margin-top:2px}
.chip.s-pending{background:transparent;border:1.5px dashed var(--orange)}
.chip.s-pending .ci{background:transparent;color:var(--c);box-shadow:inset 0 0 0 1.2px var(--c)}
.chip.s-discarded{opacity:.5}
.chip.s-discarded .ct,.chip.done .ct{text-decoration:line-through}
.col-add{all:unset;text-align:center;color:var(--blue);font-size:14px;font-weight:600;padding:8px;border-radius:12px;cursor:pointer}
.col-add:hover{background:var(--fill)}
.col-add:focus-visible{outline:2px solid var(--blue)}
.col-empty{margin:0;font-size:13px;color:var(--label2);padding:4px 2px}
.switch{position:relative;display:inline-block;width:51px;height:31px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--fill2);transition:background .2s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.22);transition:transform .2s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}

/* Decide / feed / settings */
.flow{background:var(--bg2);border-radius:22px;padding:14px 16px;display:grid;gap:10px;margin-top:24px}
.flow-steps{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;font-weight:600}

.fs.d{background:var(--red-t);color:var(--red-ink)} .fs.a{background:var(--purple-t);color:var(--purple-ink)} .fs.x{background:var(--fill);color:var(--label2)}
.arrow{color:var(--label3);font-weight:500}
.flow p{margin:0;font-size:14px;color:var(--label2);line-height:1.4}
.drow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;font-size:15px;color:var(--label2)}
.empty{background:var(--bg2);border-radius:22px;padding:28px 20px;text-align:center;display:grid;justify-items:center;gap:6px;margin-top:8px}

.empty h3{margin:6px 0 0;font-size:19px}

.feed{background:var(--bg2);border-radius:22px;overflow:hidden}
.fe{all:unset;position:relative;box-sizing:border-box;width:100%;display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 16px;cursor:pointer}
.fe:focus-visible{outline:2px solid var(--blue);outline-offset:-3px}
.fe+.fe::before{content:"";position:absolute;top:0;left:60px;right:0;height:1px;transform:scaleY(.5);background:var(--sep)}
.fe .av{--s:32px}
.fe p{margin:0;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.fe p small{display:block;color:var(--label2);font-size:13px;margin-top:2px}
.fe time{font-size:12px;color:var(--label2);white-space:nowrap;font-variant-numeric:tabular-nums;padding-top:2px}
.fe .unread{position:absolute;left:6px;top:24px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.srows{background:var(--bg2);border-radius:20px;overflow:hidden}
.srow{all:unset;position:relative;box-sizing:border-box;width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) auto 14px;gap:12px;align-items:center;min-height:52px;padding:8px 14px 8px 16px;cursor:pointer;font-size:17px}
.srow:focus-visible{outline:2px solid var(--blue);outline-offset:-3px}
.srow+.srow::before{content:"";position:absolute;top:0;left:58px;right:0;height:1px;transform:scaleY(.5);background:var(--sep)}
.srow .ti{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--tc,var(--blue));color:#fff}
.srow .ti svg{width:18px;height:18px}
.srow .val{color:var(--label2);font-size:16px;text-align:right;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .chev{color:var(--label3)} .srow .chev svg{width:14px;height:14px}
.srow.red{color:var(--red)} .srow.red .ti{--tc:var(--red)}
.plan-btn{all:unset;display:inline-flex;align-items:center;gap:6px;max-width:100%;font-size:15px;font-weight:600;color:var(--blue);cursor:pointer;margin-bottom:2px}
.plan-btn svg{width:16px;height:16px;flex:none} .plan-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan-btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.plancard{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--bg2);cursor:pointer}
.plancard.on{box-shadow:inset 0 0 0 2px var(--blue)} .plancard:focus-visible{outline:2px solid var(--blue)}
.plancard .pi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--hero-traslado)}
.plancard .pi svg{width:24px;height:24px} .plancard b{display:block;font-size:17px} .plancard small{display:block;color:var(--label2);font-size:13px;margin-top:2px}
.plancard .cnt{font:700 20px/1 var(--font-round);color:var(--blue);text-align:right} .plancard .cnt small{font:600 11px var(--font);margin:2px 0 0}
.plans{display:grid;gap:8px}
.chk-list label{display:flex;align-items:center;gap:10px;font-size:17px;flex:1;cursor:pointer} .chk-list input{width:22px;height:22px;accent-color:var(--blue)}
.tripcard{display:grid;gap:10px;background:var(--bg2);border-radius:22px;padding:16px;margin-bottom:8px}
.tripcard h2{margin:0;font-size:24px;font-weight:700}
.tripcard p{margin:0;color:var(--label2);font-size:15px}
.people{display:flex;flex-wrap:wrap;gap:8px}
.person{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--chip);font-size:15px}
.person .av{--s:28px}
.person small{color:var(--label2);font-size:12px}
.budget{display:grid}
.brow{display:flex;justify-content:space-between;gap:12px;padding:11px 16px;font-size:15px;position:relative}
.brow+.brow::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;transform:scaleY(.5);background:var(--sep)}
.brow b{font-variant-numeric:tabular-nums}
.brow.tot{font-weight:700;font-size:17px}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}

.badge{position:absolute;top:3px;left:calc(50% + 4px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font:700 11px/18px var(--font-round);text-align:center;font-style:normal}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:12px;
  padding:10px 10px 10px 18px;border-radius:24px;font-size:15px;width:max-content;max-width:calc(100% - 32px);animation:pop .25s ease-out}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;animation:fade .2s}
.sheet{position:fixed;z-index:51;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));
  max-width:560px;margin:0 auto;max-height:calc(100% - 56px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;border-radius:34px;background:var(--glass-solid);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--glass-line);box-shadow:0 20px 60px rgba(0,0,0,.28),inset 0 1px 0 var(--glass-hi);animation:up .34s cubic-bezier(.2,.9,.25,1)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:8px auto 0;flex:none}
.sh-head{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;padding:6px 12px 4px;flex:none}
.sh-head h2{margin:0;text-align:center;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbtn{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--fill);color:var(--label);cursor:pointer}
.cbtn svg{width:20px;height:20px}
.cbtn.primary{background:var(--blue);color:#fff}
.sh-body{overflow-y:auto;min-height:0;padding:8px 16px 18px;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.sh-body>*{flex:none}
.sh-body.center{text-align:center;padding-top:14px}
.ctitle{margin:0;font-size:20px;font-weight:700}
.confirm-msg{margin:0;color:var(--label2);font-size:15px;line-height:1.4;padding:0 8px}
.fgroup{background:var(--bg2);border-radius:20px;overflow:hidden}
.frow{position:relative;display:flex;align-items:center;gap:12px;min-height:50px;padding:4px 16px}
.frow+.frow::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;transform:scaleY(.5);background:var(--sep)}
.flabel{flex:1;font-size:17px;min-width:0}
.fin{border:0;background:transparent;color:var(--label);font:17px var(--font);width:100%;padding:10px 0;outline:none;min-width:0}
textarea.fin{resize:none;line-height:1.35}
.fin.invalid::placeholder{color:var(--red)}
.fin:focus-visible{outline:none}
.fpick{border:0;border-radius:10px;background:var(--fill);color:var(--label);font:17px var(--font);padding:6px 10px;max-width:62%;min-width:0}
select.fpick{appearance:none;-webkit-appearance:none;text-overflow:ellipsis;color:var(--blue)}

.fpick.num{width:96px;text-align:right}
.fhead{margin:0 16px 6px;font-size:13px;color:var(--label2);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.ffoot{margin:-8px 16px 0;font-size:13px;color:var(--label2);line-height:1.4}
.ferr{margin:0 4px;font-size:14px;color:var(--red-ink)}
.status-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:var(--label2);padding:0 4px}
.maplink{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;text-decoration:none;color:var(--blue);white-space:nowrap}
.maplink svg{width:18px;height:18px}
.cats{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
.cat{position:relative}
.cat input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.cat span{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 6px;border-radius:999px;background:var(--chip);font-size:15px}
.cat i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--c);color:#fff}

.cat input:checked+span{box-shadow:inset 0 0 0 2px var(--c);font-weight:600}

.vote-box{background:var(--bg2);border-radius:20px;padding:14px 16px;display:grid;gap:12px}

.pick+.pick::before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;transform:scaleY(.5);background:var(--sep)}

@keyframes up{from{transform:translateY(110%)}to{transform:none}}

/* Itinerario: tablero continuo con todos los días del plan (previos, Día 1…N) */

body.t-itinerario .lt{max-width:none}

/* Si la app no arranca, explica qué revisar en lugar de quedarse cargando */
window.__itbFallo = function(msg){
  var v = document.getElementById('view'); if(!v || window.__itbOk) return;
  v.innerHTML = '<div style="margin:24px 0;padding:18px;border-radius:18px;background:#FFF4E5;color:#7A2E0E;font:16px/1.45 -apple-system,system-ui,sans-serif">'

    + '2. Toca <b>Add file › Upload files</b> y sube otra vez el <b>index.html</b> de la carpeta <b>subir-a-github</b>.<br>'
    + '3. Toca <b>Commit changes</b>, espera 2 minutos y vuelve a abrir la app.<br><br>'

};

<script>
/* ===== NÚCLEO COMPARTIDO =====
   Las mismas reglas corren en la app (para respuesta inmediata y modo demo) y en Apps Script (fuente de verdad).
   Estado completo: {viajes, personas, dias, items, votos, evals}. Cada día, actividad y evaluación lleva "viaje" (id del plan).
   aplicarGlobal() gestiona los planes y pasa el resto de operaciones a aplicar() sobre la vista de un solo plan. */
var NUCLEO = (function () {
  var ESTADO_TXT = { pending: 'Por confirmar', confirmed: 'Confirmada', discarded: 'Descartada', archived: 'Archivada' };
  var CAT_TXT = { visita: 'Visita', playa: 'Playa', foto: 'Mirador', comida: 'Comida', compras: 'Compras', noche: 'Noche',
    transporte: 'Traslado', vuelo: 'Vuelo', alojamiento: 'Alojamiento', tramite: 'Trámite' };
  var AVISO_TXT = { none: 'Sin aviso', at: 'A la hora', h1: '1 hora antes', h3: '3 horas antes', d1: '1 día antes',
    d3: '3 días antes', w1: '1 semana antes', custom: 'Fecha personalizada' };
  var AVISO_MIN = { at: 0, h1: 60, h3: 180, d1: 1440, d3: 4320, w1: 10080 };
  var TEMA_TXT = { ciudad: 'Ciudad', playa: 'Playa', traslado: 'Traslado' };
  var CAMPOS = ['fecha', 'hora', 'fin', 'titulo', 'cat', 'nota', 'lugar', 'costo', 'moneda', 'reserva', 'aviso', 'aviso_fecha', 'responsable', 'creado_por'];
  var CAMPO_TXT = { fecha: 'la fecha', hora: 'la hora', fin: 'la hora de fin', titulo: 'el nombre', cat: 'la categoría',
    nota: 'la nota', lugar: 'el lugar', costo: 'el costo', moneda: 'la moneda', reserva: 'la reserva', aviso: 'el aviso',
    aviso_fecha: 'la fecha del aviso', responsable: 'el responsable', creado_por: 'quién la creó' };
  var DOW = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
  var MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function d2u(f) { var p = String(f).split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function u2d(ms) { var t = new Date(ms); return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) + '-' + pad(t.getUTCDate()); }
  function addDays(f, k) { return u2d(d2u(f) + k * 864e5); }
  function diffDays(a, b) { return Math.round((d2u(b) - d2u(a)) / 864e5); }
  function corto(f) { if (!f) return ''; var t = new Date(d2u(f)); return DOW[t.getUTCDay()] + ' ' + t.getUTCDate() + ' ' + MES[t.getUTCMonth()]; }
  function nuevoId() { return 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esSi(v) { return v === true || /^(si|sí|true|1|yes)$/i.test(String(v || '').trim()); }
  function txt(v) { return v == null ? '' : String(v); }

  function delDia(st, fecha) {
    return st.items.filter(function (i) { return i.fecha === fecha; })
      .sort(function (a, b) { return (+a.orden || 0) - (+b.orden || 0); });
  }
  function etiquetaDia(v, f) {
    if (!v || !f) return corto(f);
    if (f < v.inicio) return 'previo del ' + corto(f);
    if (f > v.fin) return corto(f);
    return 'Día ' + (diffDays(v.inicio, f) + 1) + ' (' + corto(f) + ')';
  }
  function nombresLista(v) {
    var xs = txt(v).split(',').map(function (x) { return x.trim(); }).filter(Boolean);
    return xs.length <= 1 ? (xs[0] || '') : xs.slice(0, -1).join(', ') + ' y ' + xs[xs.length - 1];
  }
  function numerar(xs) { xs.forEach(function (i, k) { i.orden = k + 1; }); }
  function insertarPorHora(st, it) {
    var xs = delDia(st, it.fecha).filter(function (i) { return i.id !== it.id; });
    var pos = xs.length;
    if (it.hora) for (var k = 0; k < xs.length; k++) if (xs[k].hora && xs[k].hora > it.hora) { pos = k; break; }
    xs.splice(pos, 0, it); numerar(xs);
  }

  function aplicar(st, op, actor, ahora) {
    var out = { ok: true, hist: [], avisos: [], cambio: false, item: null };
    var Q = '«', C = '»';
    st.votos = st.votos || []; st.evals = st.evals || []; st.dias = st.dias || [];

    function log(accion, it, detalle, tipo, texto, para) {
      out.hist.push({ fecha: ahora, persona: actor, accion: accion, ref: it && it.id ? it.id : '', titulo: it ? it.titulo : '', detalle: detalle || '' });
      if (tipo) out.avisos.push({ tipo: tipo, texto: texto, ref: it && it.id ? it.id : '', para: para || 'otros' });
      out.cambio = true;
    }
    function buscar(id) { for (var k = 0; k < st.items.length; k++) if (st.items[k].id === id) return st.items[k]; return null; }
    function tocar(it) { it.version = (+it.version || 0) + 1; it.act_por = actor; it.act_en = ahora; }
    function nombres() { return st.personas.map(function (p) { return p.nombre; }); }
    function consenso(it) {
      if (!it || it.estado !== 'pending' || !esSi(st.viaje.auto_confirmar)) return;
      var ps = nombres(); if (!ps.length) return;
      var vs = st.votos.filter(function (v) { return v.item === it.id && ps.indexOf(v.persona) > -1; });
      if (!ps.every(function (p) { return vs.some(function (v) { return v.persona === p; }); })) return;
      var si = vs.filter(function (v) { return v.voto === 'si'; }).length;
      var multi = ps.length > 1;
      if (si === ps.length) {
        it.estado = 'confirmed'; tocar(it);
        out.hist.push({ fecha: ahora, persona: multi ? 'Todos' : actor, accion: multi ? 'confirmaron' : 'confirmó', ref: it.id, titulo: it.titulo, detalle: 'Todos votaron sí' });
        if (multi) out.avisos.push({ tipo: 'estado', texto: 'Todos votaron sí: ' + Q + it.titulo + C + ' quedó confirmada para el ' + corto(it.fecha), ref: it.id, para: 'todos' });
      } else if (si === 0) {
        it.estado = 'discarded'; tocar(it);
        out.hist.push({ fecha: ahora, persona: multi ? 'Todos' : actor, accion: multi ? 'descartaron' : 'descartó', ref: it.id, titulo: it.titulo, detalle: 'Nadie votó sí' });
        if (multi) out.avisos.push({ tipo: 'estado', texto: 'Nadie votó sí: ' + Q + it.titulo + C + ' quedó descartada', ref: it.id, para: 'todos' });
      }
    }
    function votar(id, voto, silencioso) {
      var v = null;
      for (var k = 0; k < st.votos.length; k++) if (st.votos[k].item === id && st.votos[k].persona === actor) v = st.votos[k];
      if (v) { v.voto = voto; v.fecha = ahora; } else st.votos.push({ item: id, persona: actor, voto: voto, fecha: ahora });
      var it = buscar(id), antes = it.estado;
      if (!silencioso) log(voto === 'si' ? 'votó sí por' : 'votó no por', it, '', null);
      out.cambio = true;
      consenso(it);
      if (!silencioso && it.estado === antes) out.avisos.push({ tipo: 'voto', ref: it.id, para: 'otros',
        texto: actor + (voto === 'si' ? ' quiere ir a ' : ' prefiere no ir a ') + Q + it.titulo + C + ' (' + corto(it.fecha) + ')' });
    }

    var it;
    switch (op.op) {
      case 'guardar': {
        var d = op.item || {};
        it = buscar(d.id);
        if ((!it || d.titulo !== undefined) && !txt(d.titulo).trim()) return { ok: false, error: 'Falta el nombre de la actividad' };
        if ((!it || d.fecha !== undefined) && !/^\d{4}-\d{2}-\d{2}$/.test(txt(d.fecha))) return { ok: false, error: 'Falta la fecha' };
        if (!it) {
          it = { id: d.id || nuevoId(), estado: 'pending', orden: 0, creado_por: actor, creado_en: ahora, version: 0, aviso_enviado: '', hecho: '' };
          CAMPOS.forEach(function (k) { it[k] = txt(d[k]); });
          it.creado_por = actor;
          if (!it.aviso) it.aviso = 'none'; if (!it.cat) it.cat = 'visita';
          tocar(it); st.items.push(it); insertarPorHora(st, it);
          log('agregó', it, corto(it.fecha), 'alta', actor + ' propuso ' + Q + it.titulo + C + ' para el ' + etiquetaDia(st.viaje, it.fecha) + (it.hora ? ' a las ' + it.hora : '') + '. ¿Va?');
          votar(it.id, 'si', true);
        } else {
          if (op.antes) {
            // Fusión por campo: solo hay conflicto si otra persona cambió el mismo dato que tú
            var choques = Object.keys(op.antes).filter(function (k) {
              return CAMPOS.indexOf(k) > -1 && d[k] !== undefined && txt(it[k]) !== txt(op.antes[k]) && txt(it[k]) !== txt(d[k]);
            });
            if (choques.length) return { ok: false, conflicto: true, item: it,
              error: (it.act_por || 'Otra persona') + ' también cambió ' + choques.map(function (k) { return CAMPO_TXT[k]; }).join(', ') + '. Se cargó su versión; revisa y vuelve a guardar.' };
          } else if (op.base != null && +op.base !== +it.version)
            return { ok: false, conflicto: true, item: it, error: (it.act_por || 'Otra persona') + ' cambió esta actividad hace poco. Se cargó su versión.' };
          var antesFecha = it.fecha, cambios = [];
          CAMPOS.forEach(function (k) { if (d[k] !== undefined && txt(d[k]) !== txt(it[k])) { cambios.push(k); it[k] = txt(d[k]); } });
          if (!cambios.length) return { ok: true, sinCambios: true, item: it };
          if (cambios.indexOf('fecha') > -1) { numerar(delDia(st, antesFecha).filter(function (i) { return i.id !== it.id; })); insertarPorHora(st, it); }
          if (cambios.some(function (k) { return k === 'fecha' || k === 'hora' || k === 'aviso' || k === 'aviso_fecha'; })) it.aviso_enviado = '';

const Demo = {
  db(){ let d = LS.get(K.demo, null); if(!d || !d.items || !d.viajes){ d = JSON.parse(JSON.stringify(SEED)); LS.set(K.demo, d); } return d; },
  call(req){

      if(req.rev!=null && +req.rev===d.rev) return {ok:true, sinCambios:true, rev:d.rev};
      const e = JSON.parse(JSON.stringify(d));

      return {ok:true, rev:d.rev, estado:e};
    }
    if(req.op==='probar' || req.op==='ping') return {ok:true, rev:d.rev, avisados:[]};
    if(req.op==='lote'){
      const revAntes = d.rev, resultados = [], av = new Set();
      (req.ops||[]).forEach(op => { const x = this.call(Object.assign({clave:req.clave, persona:req.persona}, op)); resultados.push(x); (x.avisados||[]).forEach(n => av.add(n)); });
      return {ok:true, revAntes, rev:this.db().rev, resultados, avisados:[...av]};
    }
    if(!d.personas.some(p => p.nombre===req.persona)) return {ok:false, error:'persona', mensaje:'Elige quién eres'};
    const r = N.aplicarGlobal(d, req, req.persona, new Date().toISOString());
    if(!r.ok) return {ok:false, error:r.conflicto?'conflicto':'regla', mensaje:r.error, item:r.item};

/* ---------- Comunicación con la hoja ---------- */
// Cada cambio se ve al instante en el teléfono y queda en una cola guardada aquí.
// La cola sale en un solo envío (op 'lote'); si nadie más cambió nada, no se vuelve a descargar la hoja.
const enVuelo = new Set(); let sinLote = false, reintento = 0, reintentoT = null, calentado = 0;
async function rpc(req, ms){
  const body = Object.assign({clave:cfg.clave, persona:cfg.persona}, req);
  if(MODO==='demo') return Demo.call(body);
  if(MODO==='gas') return await new Promise((res,rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(body));
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), ms || 20000), vuelo = {ctrl, desde:Date.now()};
  enVuelo.add(vuelo);
  try{
    const r = await fetch(cfg.api, {method:'POST', body:JSON.stringify(body), headers:{'Content-Type':'text/plain;charset=utf-8'}, signal:ctrl.signal, cache:'no-store'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); enVuelo.delete(vuelo); }
}
// Corta los envíos que quedaron colgados (por ejemplo, la app pasó a segundo plano a mitad de un envío)
function cortarColgados(ms){ const ahora = Date.now(); enVuelo.forEach(x => { if(ahora - x.desde > ms) x.ctrl.abort(); }); }
// Despierta el servidor mientras escribes, para que al guardar responda rápido
function precalentar(){
  if(MODO!=='http' || !cfg.clave || syncing || Date.now()-calentado < 45000) return;
  calentado = Date.now(); rpc({op:'ping'}, 10000).catch(() => {});
}
let netT = null;
function setNet(s){
  clearTimeout(netT);
  // «Guardando…» solo aparece si el envío tarda: los cambios ya se ven en pantalla
  if(s==='enviando'){ if(net!=='enviando') netT = setTimeout(() => { net = 'enviando'; renderStatus(); }, 1200); return; }
  net = s; renderStatus();
}
function reintentar(){
  clearTimeout(reintentoT);
  const ms = [2000, 5000, 10000, 20000][Math.min(reintento, 3)]; reintento++;
  reintentoT = setTimeout(() => { if(MODO!=='demo' && document.visibilityState==='visible') sync(); }, ms);
}
function guardarLocal(){ if(MODO!=='demo') LS.set(K.cache, full); LS.set(K.outbox, outbox); }
function elegirPlan(xs){
  const t = hoy();
  return xs.find(v => v.inicio<=t && t<=v.fin) || xs.filter(v => v.inicio>t).sort((a,b) => a.inicio<b.inicio?-1:1)[0] || xs.slice().sort((a,b) => a.inicio<b.inicio?1:-1)[0] || null;
}
function armarVista(){
  if(!full){ st = null; return; }
  ['viajes','items','votos','evals','dias','historial','personas'].forEach(k => full[k] = full[k] || []);
  const activos = full.viajes.filter(v => v.estado!=='archivado');
  if(!ui.plan || !full.viajes.some(v => v.id===ui.plan)) ui.plan = (elegirPlan(activos) || elegirPlan(full.viajes) || {}).id || null;
  const sub = ui.plan ? N.vista(full, ui.plan) : null;
  st = sub ? Object.assign(sub, {rev:full.rev, historial: full.historial.filter(h => !h.viaje || h.viaje===ui.plan),
    mi_ntfy:full.mi_ntfy, url_web:full.url_web, avisar:full.avisar, resumen_diario:full.resumen_diario,
    vapid:full.vapid || '', avisos_iphone:full.avisos_iphone, mis_dispositivos:full.mis_dispositivos || []}) : null;
}
const GLOBAL = {crear_viaje:1, editar_viaje:1};

async function act(req, o = {}){
  if(!full) return false;
  if(!cfg.persona || !full.personas.some(p => p.nombre===cfg.persona)){ openSheet({type:'quien'}); return false; }
  if(!GLOBAL[req.op]){ if(!ui.plan) return false; req.viaje = req.viaje || ui.plan; }
  if(req.op==='guardar' && !req.item.id) req.item.id = N.nuevoId();
  if(req.op==='crear_viaje' && !req.viaje.id) req.viaje.id = 'v' + N.nuevoId().slice(1);
  const local = N.aplicarGlobal(full, JSON.parse(JSON.stringify(req)), cfg.persona, new Date().toISOString());
  if(!local.ok){ toast(local.error); if(local.conflicto) sync(true); return false; }
  if(local.sinCambios) return true;
  local.hist.slice().reverse().forEach(h => full.historial.unshift(h));
  if(req.op==='crear_viaje'){ ui.plan = req.viaje.id; ui.dia = null; }
  outbox.push({req, aviso:!!o.msg});
  armarVista(); guardarLocal(); render();
  const msg = typeof o.msg==='function' ? o.msg(local) : o.msg;
  if(msg) toast(msg, o.undo);
  sync();
  return true;
}
async function flush(){
  const res = {ok:true, envio:false, limpio:true};
  while(outbox.length){
    const jobs = outbox.slice(0, sinLote ? 1 : 25), base = full ? full.rev : null;
    setNet('enviando');
    let r;
    try{ r = sinLote ? await rpc(jobs[0].req) : await rpc({op:'lote', ops:jobs.map(j => j.req)}, 25000); }
    catch(e){ setNet('offline'); reintentar(); res.ok = false; return res; }
    if(!sinLote && r && !r.ok && /desconocida/i.test(r.mensaje || '')){ sinLote = true; continue; } // servidor de una versión anterior
    if(!r || (!r.ok && !r.resultados)){
      const err = r ? r.error : '';
      if(err==='clave'){ setNet('error'); if(!ui.sheet) openSheet({type:'conectar', error:r.mensaje}); res.ok = false; return res; }
      if(err==='persona'){ setNet('error'); openSheet({type:'quien'}); res.ok = false; return res; }
      if(err==='ocupado' || err==='hoja' || !r){ setNet('offline'); reintentar(); res.ok = false; return res; }
      outbox.shift(); guardarLocal(); res.envio = true; res.limpio = false;
      toast((r && r.mensaje) || 'No se pudo guardar el cambio');
      continue;
    }
    const lista_ = sinLote ? [r] : (r.resultados || []);
    let fallo = false;
    jobs.forEach((job, k) => { const x = lista_[k]; if(x && !x.ok){ fallo = true; if(x.error==='conflicto') toast('Alguien cambió esto al mismo tiempo. Se cargó la versión más reciente'); else toast(x.mensaje || 'No se pudo guardar un cambio'); } });
    outbox.splice(0, jobs.length); res.envio = true; reintento = 0;
    // Si la hoja estaba igual que en este teléfono, basta con anotar la nueva revisión
    if(full && !fallo && r.revAntes!=null && r.revAntes===base && r.rev!=null) full.rev = r.rev; else res.limpio = false;
    guardarLocal();
    if(jobs.some(j => j.aviso) && r.avisados && r.avisados.length){
      const quien = r.avisados.filter(n => n!==cfg.persona);
      if(quien.length) toastAppend(MODO==='demo' ? ' · ' + lista(quien) + ' recibiría un aviso' : ' · se avisó a ' + lista(quien));
    }
  }
  return res;
}
let syncing = false, syncAgain = false, syncForzar = false;
async function sync(forzar){
  if(syncing){ syncAgain = true; if(forzar) syncForzar = true; return; }
  syncing = true;
  try{
    const f = await flush();
    if(!f.ok) return;
    if(f.envio && f.limpio && !forzar){ lastSync = Date.now(); setNet(MODO==='demo' ? 'demo' : 'ok'); return; }
    const r = await rpc({op:'leer', rev:(forzar || !full) ? null : full.rev}, 20000);
    if(!r || !r.ok){
      if(r && r.error==='clave'){ setNet('error'); if(!ui.sheet) openSheet({type:'conectar', error:r.mensaje}); }
      else { setNet('error'); reintentar(); }
      return;
    }
    lastSync = Date.now(); reintento = 0; setNet(MODO==='demo' ? 'demo' : 'ok');
    if(r.sinCambios){ firstLoad = false; abrirPend(); return; }
    if(outbox.length){ syncAgain = true; return; } // llegaron cambios nuevos mientras se descargaba: primero se envían
    const prevTop = full && full.historial && full.historial[0] ? full.historial[0].fecha : null;
    full = Object.assign({}, r.estado, {rev:r.rev});
    armarVista();
    guardarLocal();
    if(prevTop && !firstLoad){
      const mios = new Set(full.historial.filter(h => h.persona===cfg.persona).map(h => h.fecha));
      const nuevos = full.historial.filter(h => h.fecha > prevTop && h.persona!==cfg.persona && h.persona!=='Sistema' && h.accion!=='calificó' && !mios.has(h.fecha));
      if(nuevos.length){
        const quienes = [...new Set(nuevos.map(h => h.persona).filter(p => p!=='Todos'))];
        toast(nuevos.length===1 ? textoHist(nuevos[0]) : quienes.length===1 ? `${quienes[0]} hizo ${nuevos.length} cambios` : `Hay ${nuevos.length} cambios nuevos`, {ver:true});
      }
    }
    firstLoad = false;
    if(!cfg.persona || !full.personas.some(p => p.nombre===cfg.persona)){ if(!ui.sheet) openSheet({type:'quien'}); }
    render();
    if(ui.sheet && ui.sheet.type==='avisos') renderSheet();
    abrirPend();
  }catch(e){ setNet('offline'); reintentar(); }
  finally{
    syncing = false;
    if(syncAgain){ const fz = syncForzar; syncAgain = false; syncForzar = false; setTimeout(() => sync(fz), 60); }
  }
}

const V = () => st.viaje;
function diasViaje(){ const out=[]; const n=N.diffDays(V().inicio, V().fin); for(let k=0;k<=n;k++) out.push(N.addDays(V().inicio,k)); return out; }

function delDia(f){ return st.items.filter(i => i.fecha===f).sort((a,b) => (+a.orden||0)-(+b.orden||0)); }
function previos(){ return st.items.filter(i => i.fecha < V().inicio).sort((a,b) => a.fecha<b.fecha?-1:a.fecha>b.fecha?1:(+a.orden||0)-(+b.orden||0)); }
function posteriores(){ return st.items.filter(i => i.fecha > V().fin).sort((a,b) => a.fecha<b.fecha?-1:a.fecha>b.fecha?1:(+a.orden||0)-(+b.orden||0)); }

function av(n, s){ return `<span class="av" style="--pc:${esc(colorDe(n))}${s?';--s:'+s+'px':''}" aria-hidden="true">${esc((n||'?').trim().charAt(0))}</span>`; }

function tzOff(tz, f){
  try{
    const ms = N.d2u(f) + 12*3600e3;
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(new Date(ms)).map(x => [x.type,x.value]));
    return (Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute) - ms) / 60000;
  }catch(e){ return null; }
}
function conflictos(items){
  const m={}, mm=s => { const [h,x]=s.split(':').map(Number); return h*60+x; };
  const t = items.filter(i => isActive(i) && i.hora);
  for(let a=0;a<t.length;a++) for(let b=a+1;b<t.length;b++){
    const A=t[a], B=t[b]; if(A.fecha!==B.fecha) continue;
    const as=mm(A.hora), bs=mm(B.hora); let ae=A.fin?mm(A.fin):as+1, be=B.fin?mm(B.fin):bs+1; if(ae<=as) ae=as+1; if(be<=bs) be=bs+1;
    if(as<be && bs<ae){ (m[A.id]=m[A.id]||[]).push(B.titulo); (m[B.id]=m[B.id]||[]).push(A.titulo); }
  }
  return m;
}
function textoAviso(it){

  const base = N.d2u(it.fecha) + (()=>{ const [h,m]=(it.hora||'09:00').split(':').map(Number); return (h*60+m)*60000; })() - (N.AVISO_MIN[it.aviso]||0)*60000;
  const t = new Date(base), f = N.u2d(base);

function costoTxt(it){ if(!it.costo) return ''; const n=+String(it.costo).replace(',','.'); if(!isFinite(n)) return ''; return (MON[it.moneda||'BRL']||it.moneda||'') + ' ' + (Math.round(n*100)/100).toLocaleString('es-PE'); }

}

let toastT = null, toastUndo = null;
function toast(msg, o){
  const t = $('#toast'); toastUndo = o && o.op ? o : null;
  const btn = toastUndo ? '<button data-act="undo">Deshacer</button>' : (o && o.ver ? '<button data-act="tab" data-v="actividad">Ver</button>' : '');
  t.innerHTML = `<span id="toastTxt">${esc(msg)}</span>${btn}`;
  t.hidden = true; void t.offsetWidth; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; toastUndo = null; }, (toastUndo || (o && o.ver)) ? 5500 : 3000);
}
function toastAppend(extra){ const t=$('#toast'), s=$('#toastTxt'); if(t.hidden || !s) return; s.textContent += extra; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; toastUndo = null; }, 4000); }

const MSG = {confirmed:'Confirmada', discarded:'Descartada. Bajó al final del día', archived:'Archivada. Ya no aparece en la agenda', pending:'Restaurada. Quedó por decidir'};
function buscar(id){ return st.items.find(i => i.id===id); }
function cambiarEstado(id, estado){
  const it = buscar(id); if(!it) return;
  act({op:'estado', id, estado}, {msg:MSG[estado], undo:{op:'estado', id, estado:it.estado}});
}
function votar(id, v){
  act({op:'votar', id, voto:v}, {msg: r => r.item && r.item.estado==='confirmed' ? 'Confirmada: todos votaron sí' : r.item && r.item.estado==='discarded' ? 'Descartada: nadie votó sí' : v==='si' ? 'Votaste sí' : 'Votaste no'});

function hecho(id){ const it = buscar(id); if(it) act({op:'hecho', id, valor:!it.hecho}, {msg: it.hecho ? 'Marcada como pendiente' : '¡Hecha! Califícala cuando quieras'}); }
async function enLote(items, estado, msg){
  if(!items.length) return;
  for(const it of items){
    const req = {op:'estado', id:it.id, estado};
    req.viaje = ui.plan;
    const local = N.aplicarGlobal(full, JSON.parse(JSON.stringify(req)), cfg.persona, new Date().toISOString());
    if(local.ok && !local.sinCambios){ local.hist.slice().reverse().forEach(h => full.historial.unshift(h)); outbox.push({req, aviso:false}); }
  }
  armarVista(); guardarLocal(); render(); toast(`${msg} (${items.length})`); sync();
}

  const filtra = xs => xs.filter(i => modo==='todo' ? isActive(i) : i.estado==='confirmed');
  const pre = filtra(previos());
  if(pre.length){ L.push('Antes del viaje'); pre.forEach(i => L.push(linea(i).replace('  ', '  ' + N.corto(i.fecha) + ' · '))); L.push(''); }

  if(dest===it.fecha && prevIds.join()===ids.join()){ if(kdPend){ kdPend = false; render(); } return; }
  kdPend = false;
  act({op:'mover', id:d.id, fecha:dest, ids}, {msg: dest!==it.fecha ? 'Movida a ' + etiquetaFecha(dest) : 'Orden del día actualizado', undo: {op:'mover', id:d.id, fecha:it.fecha, ids:prevIds}});
}
document.addEventListener('pointerup', kdFin);
document.addEventListener('pointercancel', kdFin);
document.addEventListener('keydown', e => { if(e.key==='Escape' && kd){ kdFin({pointerId:kd.pid, type:'pointercancel'}); } });

/* ---------- Inicio ---------- */
function iniciar(){
  window.__itbOk = true;
  MODO = cfg.api ? 'http' : 'demo';
  firstLoad = true;
  if(MODO==='demo'){
    const r = Demo.call({op:'leer'}); full = Object.assign(r.estado, {rev:r.rev}); net = 'demo';
    if(!cfg.persona || !full.personas.some(p => p.nombre===cfg.persona)){ cfg.persona = full.personas[0].nombre; LS.set(K.cfg, cfg); }
    firstLoad = false;
  } else {
    full = LS.get(K.cache, null); if(full && !full.viajes) full = null; net = 'cargando';
  }
  armarVista();
  const h = location.hash.slice(1); if(TABS[h]) ui.tab = h; else if(h==='semana') ui.tab = 'itinerario';
  aplicarTema();
  render();
  if(MODO!=='demo'){ if(!cfg.clave) openSheet({type:'conectar'}); else sync(!full || full.vapid===undefined); }
  leerEnlace();
  estadoPush();
}
$('#btn-add').innerHTML = ico('plus');
iniciar();
if(!GAS && document.querySelector('link[rel="manifest"]') && 'serviceWorker' in navigator && window.isSecureContext){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
